# OPTIONAL. The app does not need Docker, or Postgres, or a .env file.
#
#   pnpm install && pnpm build && pnpm start
#
# runs the whole site from the bundled snapshot in src/data/snapshot.json.
# That is the deployable path, and the one to use for a preview.
#
# This compose file is for working on the data layer — editing the schema,
# changing the seed, or running `pnpm verify:parity`. Postgres is the real
# backend and takes over the moment DATABASE_URL is set.
#
#   docker compose up -d
#   echo 'DATABASE_URL="postgresql://rakuxon:rakuxon_dev@localhost:55432/rakuxon_city"' >> .env
#   pnpm db:migrate && pnpm db:seed && pnpm snapshot
#
# Host port 55432 because a system Postgres often already holds 5432. Any other
# Postgres works just as well — point DATABASE_URL at it and skip this file.

services:
  postgres:
    image: postgres:17-alpine
    container_name: rakuxon-city-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rakuxon
      POSTGRES_PASSWORD: rakuxon_dev
      POSTGRES_DB: rakuxon_city
    ports:
      - "55432:5432"
    volumes:
      - rakuxon-city-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakuxon -d rakuxon_city"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rakuxon-city-pgdata:
